name: ATOMICA CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-project-management:
    name: Validate Multi-Agent Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Project Management Artifacts
        run: |
          echo "Checking required project-management directory structure..."
          REQUIRED_FILES=(
            "project-management/PROJECT_OVERVIEW.md"
            "project-management/ARCHITECTURE.md"
            "project-management/AGENT_ROLES.md"
            "project-management/TASK_BOARD.md"
            "project-management/DEVELOPMENT_LOG.md"
            "project-management/DECISIONS.md"
            "project-management/INTEGRATION_STATUS.md"
            "project-management/KNOWN_ISSUES.md"
            "project-management/API_CONTRACTS.md"
            "project-management/NEXT_STEPS.md"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required project management artifact: $file"
              exit 1
            fi
          done
          echo "All core project management artifacts present."

      - name: Verify Research Deliverables Blueprint
        run: |
          echo "Verifying Phase 0 Research Deliverables..."
          RESEARCH_FILES=(
            "project-management/research/MASTER_RESEARCH_REPORT.md"
            "project-management/research/CHEMISTRY_RESEARCH.md"
            "project-management/research/MOLECULAR_MODELING_RESEARCH.md"
            "project-management/research/PHYSICS_SIMULATION_RESEARCH.md"
            "project-management/research/BIOMOLECULAR_RESEARCH.md"
            "project-management/research/CELLULAR_BIOLOGY_RESEARCH.md"
            "project-management/research/PHYSIOLOGY_RESEARCH.md"
            "project-management/research/IMMUNOLOGY_RESEARCH.md"
            "project-management/research/TECH_STACK_EVALUATION.md"
            "project-management/research/SCIENTIFIC_SOFTWARE_COMPARISON.md"
            "project-management/research/DATABASE_AND_API_RESEARCH.md"
            "project-management/research/RENDERING_AND_PERFORMANCE_RESEARCH.md"
            "project-management/research/MULTI_AGENT_WORKFLOW_RESEARCH.md"
            "project-management/research/SCIENTIFIC_VALIDATION_STANDARDS.md"
            "project-management/research/SECURITY_AND_DATA_INTEGRITY.md"
            "project-management/research/IMPLEMENTATION_ROADMAP.md"
            "project-management/research/RESEARCH_BIBLIOGRAPHY.md"
            "project-management/research/UNRESOLVED_QUESTIONS.md"
          )
          for file in "${RESEARCH_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required research deliverable: $file"
              exit 1
            fi
          done
          echo "All 18 research deliverables verified."
